# The desktop app (VS-03): OpenCalc's Tauri shell, wrapping the same `webapp/`.
# Copied from OpenCalc's `desktop/` at `5d42a07` (desktop/PROVENANCE.md).
#
# A separate cargo workspace, for OpenCalc's reason (its ADR-023): Tauri's
# dependency tree is large, and every `cargo build --workspace` and `cargo clippy
# --workspace` of the engine would otherwise carry it. `fuzz/` is separate the
# same way. CI builds, lints and tests this workspace in `desktop.yml`.
#
# Unlike OpenCalc's shell, this one depends on no engine crate. The engine runs
# in the webview as WebAssembly, exactly as on the web, so the desktop draws what
# the web draws by construction rather than by keeping two hosts in step.
[workspace]

[package]
name = "openpresent-desktop"
version = "0.0.1"
publish = false
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The window and the webview.
tauri = { version = "2" }
# The platform's own Open panel, used from Rust only: no JavaScript calls
# `plugin:dialog|*`, so none of its ACL permissions are granted (as OpenCalc).
tauri-plugin-dialog = { version = "2" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "openpresent-desktop"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
