[package]
name = "spk-text-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# build_all.sh runs wasm-opt itself, with stated flags, so each row of the size
# table has a known optimizer setting.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false
[package.metadata.wasm-pack.profile.custom]
wasm-opt = false

[dependencies]
wasm-bindgen = "=0.2.130"
spk-text-core = { path = "../core" }

[features]
default = []
outline = ["spk-text-core/outline"]
shape = ["spk-text-core/shape"]
itemize = ["spk-text-core/itemize"]
lb-uax14 = ["spk-text-core/lb-uax14"]
lb-icu = ["spk-text-core/lb-icu"]
lb-icu-auto = ["spk-text-core/lb-icu-auto"]
layout = ["spk-text-core/layout"]
embed-carlito = []
embed-liberation = []
# Benchmark exports. Off for every row of the size table.
bench = []
