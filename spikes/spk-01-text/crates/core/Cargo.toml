[package]
name = "spk-text-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
skrifa = { version = "=0.46.2", optional = true }
# 0.13 pairs with skrifa 0.46 on one read-fonts (0.43), so font parsing is one
# copy in the binary. Same pair as OpenCalc's casual-calc-render (its DEP-14).
harfrust = { version = "=0.13.3", optional = true }
unicode-bidi = { version = "=0.3.18", optional = true }
unicode-script = { version = "=0.5.8", optional = true }
unicode-linebreak = { version = "=0.1.5", optional = true }
icu_segmenter = { version = "=2.4.0", optional = true }

[features]
default = []
outline = ["dep:skrifa"]
shape = ["outline", "dep:harfrust"]
itemize = ["outline", "dep:unicode-bidi", "dep:unicode-script"]
lb-uax14 = ["dep:unicode-linebreak"]
lb-icu = ["dep:icu_segmenter"]
lb-icu-auto = ["lb-icu", "icu_segmenter/auto"]
# The whole pipeline; the line breaker is chosen by the caller.
layout = ["shape", "itemize"]
