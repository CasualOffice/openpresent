# A separate workspace: nightly-only cargo-fuzz dependencies stay out of the
# product graph. Every parser has a target (docs/07-SECURITY-THREAT-MODEL.md).
[package]
name = "casual-slide-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
casual-slide-export = { path = "../crates/casual-slide-export" }
casual-slide-geometry = { path = "../crates/casual-slide-geometry" }
casual-slide-import = { path = "../crates/casual-slide-import" }
casual-slide-model = { path = "../crates/casual-slide-model" }
casual-slide-ooxml = { path = "../crates/casual-slide-ooxml" }
casual-slide-package = { path = "../crates/casual-slide-package" }
casual-slide-style = { path = "../crates/casual-slide-style" }
libfuzzer-sys = "0.4"

[workspace]

[[bin]]
name = "media_references"
path = "fuzz_targets/media_references.rs"
test = false
doc = false
bench = false

