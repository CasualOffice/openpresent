[workspace]
resolver = "3"
# Layer division: docs/19-WORKSPACE-SCAFFOLD-DESIGN.md. A crate joins when it has
# a first consumer, so this list grows with the phases.
members = [
    "crates/casual-slide-package",
    "crates/casual-slide-ooxml",
    "crates/casual-slide-model",
    "crates/casual-slide-import",
    "crates/casual-slide-export",
    "crates/casual-slide-geometry",
    "crates/casual-slide-style",
    "crates/casual-slide-render",
    "crates/casual-slide-text",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Inherited from OpenCalc for the same reason: arithmetic here runs on numbers
# from an untrusted file, and a wrapped index in release is a wrong read that the
# debug tests would have caught.
# A deck's streams and parts are inflated and walked on every first save (`docs/29`), and the
# corpus tests do that thousands of times. Unoptimized, the two crates doing it cost minutes.
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.quick-xml]
opt-level = 3

# The text crate's corpus test shapes and outlines every text body of every deck; the
# shaper and the font readers unoptimized would make it the slowest test by far.
[profile.dev.package.harfrust]
opt-level = 3

[profile.dev.package.read-fonts]
opt-level = 3

[profile.dev.package.skrifa]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true
