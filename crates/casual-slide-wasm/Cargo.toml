[package]
name = "casual-slide-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Started from OpenCalc's `casual-calc-wasm`: see PROVENANCE.md.

[lib]
crate-type = ["cdylib", "rlib"]

# As OpenCalc: skip the optional wasm-opt post-pass, since modern Rust emits
# bulk-memory ops that some cached wasm-opt binaries reject.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
# An interim edge until `-sdk` exists (docs/19): the bridge opens and draws a deck
# through `-render`'s `Deck`, which is where `-sdk` will take it from.
casual-slide-render = { path = "../casual-slide-render" }
# Save (`VS-04`): the one writer, `SavePlan`, over a package opened from the deck's
# own bytes; with nothing edited it gives those bytes back. An interim edge until
# `-sdk` exists, as `-render` is (docs/19).
casual-slide-export = { path = "../casual-slide-export" }
casual-slide-ooxml = { path = "../casual-slide-ooxml" }
# Editing (`VS-05`, `VS-06`): the one op set and undo history, applied to the deck's
# model; the model the ops change; the slide limits a save patches parts under; the
# inheritance chain that places a shape; and the caret lines `-text` lays out.
# Interim edges until `-sdk` exists, as `-render` is (docs/19).
casual-slide-transaction = { path = "../casual-slide-transaction" }
casual-slide-import = { path = "../casual-slide-import" }
casual-slide-model = { path = "../casual-slide-model" }
casual-slide-style = { path = "../casual-slide-style" }
casual-slide-text = { path = "../casual-slide-text" }
# The Shapes gallery's icons and the adjust handles (`SHAPE-01`): presets evaluated by
# the one geometry engine, as `-render` draws them.
casual-slide-geometry = { path = "../casual-slide-geometry" }
# RGBA output: the PNG `-render` writes, decoded by the same backend (already in
# the tree through `-render`, ADR-019).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }
# The browser transport, as OpenCalc (MIT or Apache-2.0).
wasm-bindgen = "0.2"
# Co-editing (`COL-04`): the protocol's JSON, already in the tree through
# `-transaction` (ADR-020).
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
# `tests/present.rs` builds a deck with a hidden slide from a fixture by
# replacing one part, through the package's own rewrite.
casual-slide-package = { path = "../casual-slide-package" }
