[package]
name = "casual-slide-package"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Pure-Rust deflate (miniz_oxide) so the crate compiles to wasm32-unknown-unknown.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The recovering reader (`salvage`): `zip` merges duplicate names and refuses damage, so
# a damaged archive is read by hand and inflated by the backend `zip` already uses.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[lints]
workspace = true
