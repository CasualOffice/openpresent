# Collaboration (VS-09): build, lint and test the collaboration server's workspace, which
# starts the server on 127.0.0.1 and runs two clients against it (`tests/two_clients.rs`):
# each edits the same text box and moves the same shape at once, and both must end with
# the same deck, with a late joiner catching up to it. Modelled on OpenCalc's collab
# server job; everything runs on GitHub's runners.
name: collab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collab-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  collab-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server/casual-slide-collab-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - name: Two clients through a running server
        run: cargo test --locked

  # COL-04: the editor itself in two headless Chrome pages against the running server,
  # as OpenCalc's browser-smoke job runs its collaboration suite. The engine is built
  # here, never taken from the tree. Chrome is the runner's own; playwright-core only
  # drives it, pinned, with no browser download.
  collab-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
      - name: Build the engine for the browser
        run: wasm-pack build crates/casual-slide-wasm --release --target web --out-dir ../../webapp/pkg
      - name: Build the collaboration server
        working-directory: server/casual-slide-collab-server
        run: cargo build --locked
      - name: Install the driver
        working-directory: tests/browser
        run: npm install --no-save --no-package-lock playwright-core@1.48.2
      - name: Two pages co-edit and save the same deck
        run: node tests/browser/collab-two-pages.mjs server/casual-slide-collab-server/target/debug/casual-slide-collab-server
