# The slide gallery (FH-02, owner instruction 43): every deck in fixtures/real and a few in
# fixtures/generated, rendered by our `render-deck` and by LibreOffice, side by side in one
# static index.html. The reference is labelled "LibreOffice", never "PowerPoint".
#
# LibreOffice comes from apt and runs headless under `unshare --net`, only here on the
# runner, never on the owner's machine (owner instructions 23, 33, 38).
name: gallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The generated decks shown beside the real ones; a name that is missing is skipped.
  GALLERY_GENERATED: "text-basic.pptx area-shape-tree.pptx area-fill.pptx area-text.pptx area-table.pptx image.pptx"

jobs:
  gallery-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Fails, naming the reason, until lane A's `render-deck` exists: an empty gallery
      # must not pass.
      - name: Build render-deck
        run: |
          set -euo pipefail
          if cargo build --release --locked -p casual-slide-render --bin render-deck; then
            echo "RENDER_DECK=target/release/render-deck" >> "$GITHUB_ENV"
          elif cargo build --release --locked -p casual-slide-render --example render-deck; then
            echo "RENDER_DECK=target/release/examples/render-deck" >> "$GITHUB_ENV"
          else
            echo "::error::render-deck is missing: lane A adds it as a bin or example of crates/casual-slide-render (render-deck DECK.pptx OUT_DIR, writing one PNG per slide)"
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils
      # Ubuntu's AppArmor refuses unprivileged user namespaces by default; `unshare` needs one.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: soffice --version | tee "$RUNNER_TEMP/lo-version.txt"
      - name: Render each deck, ours and LibreOffice's
        env:
          OPENPRESENT_ALLOW_SOFFICE: "1"
        run: |
          set -uo pipefail
          out=site
          mkdir -p "$out"
          decks=$(ls fixtures/real/*.pptx)
          for g in $GALLERY_GENERATED; do
            if [ -f "fixtures/generated/$g" ]; then decks="$decks fixtures/generated/$g"; fi
          done
          for deck in $decks; do
            name=$(basename "$deck" .pptx)
            mkdir -p "$out/$name/ours" "$out/$name/lo"
            # A deck our renderer fails on is shown as failed, not hidden.
            timeout 300 "$RENDER_DECK" "$deck" "$out/$name/ours" > "$out/$name/ours.log" 2>&1 \
              || echo "exit $?" >> "$out/$name/ours.log"
            pdfdir=$(mktemp -d)
            timeout 300 unshare -r -n soffice --headless --norestore \
              "-env:UserInstallation=file://$RUNNER_TEMP/lo-profile" \
              --convert-to pdf --outdir "$pdfdir" "$deck" > "$out/$name/lo.log" 2>&1 \
              || echo "exit $?" >> "$out/$name/lo.log"
            if [ -f "$pdfdir/$name.pdf" ]; then
              pdftoppm -png -r 96 "$pdfdir/$name.pdf" "$out/$name/lo/slide" >> "$out/$name/lo.log" 2>&1
            fi
            rm -rf "$pdfdir"
          done
      - name: Build index.html
        run: python3 tools/gallery/build.py site --lo-version "$(cat "$RUNNER_TEMP/lo-version.txt")" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery
          path: site
          retention-days: 30
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  # Publishes to GitHub Pages from main only. The owner sets Settings > Pages > Source to
  # "GitHub Actions" once; until then this job fails and the artifact above still holds it.
  gallery-deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: gallery-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
