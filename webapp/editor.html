<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Strict, as OpenCalc's editor: no inline script or style, nothing from
         another origin. `wasm-unsafe-eval` compiles the engine and nothing else;
         `blob:` images are the slides the engine draws in this page. The deck is
         read from a file the user picks and never leaves the browser, so
         `connect-src` reaches this origin alone (the engine and the icons). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>OpenPresent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7490'/%3E%3Crect x='7' y='9' width='18' height='12' rx='1.5' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M16 21v4M11 25h10' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./editor.css" />
    <link rel="stylesheet" href="./ribbon.tokens.css" />
    <link rel="stylesheet" href="./ribbon.css" />
  </head>
  <body class="editor-body">
    <a class="skip-link" href="#stage">Skip to slide</a>
    <!-- The title bar names the document, not the product (OpenCalc's
         `UX-CHR-03`): the mark, the Quick Access Toolbar and search are added by
         `ribbon.js`; the name and state are the deck's. -->
    <header class="app-header">
      <svg class="brand-logo" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><rect width="32" height="32" rx="7" class="brand-ground"/><rect x="7" y="9" width="18" height="12" rx="1.5" class="brand-line"/><path d="M16 21v4M11 25h10" class="brand-line"/></svg>
      <div class="doc-identity">
        <span class="doc-name" id="doc-name">OpenPresent</span>
        <span class="doc-state" id="doc-state"></span>
      </div>
      <div class="header-right"></div>
    </header>

    <main class="workspace" id="workspace">
      <!-- The slide thumbnail pane, PowerPoint's left column in Normal view. -->
      <nav class="slide-pane" id="slide-pane" aria-label="Slides">
        <ol class="thumbs" id="thumbs" role="listbox" aria-label="Slides" tabindex="0"></ol>
      </nav>
      <div class="stage-col">
        <section class="stage" id="stage" tabindex="0" aria-label="Slide" aria-roledescription="slide">
          <div class="slide-frame" id="slide-frame" hidden>
            <img class="slide-img" id="slide-img" alt="" draggable="false" />
          </div>
          <!-- Before a deck is open: the open and drop target. -->
          <div class="empty-state" id="empty-state">
            <div class="empty-card">
              <span class="empty-art" aria-hidden="true"></span>
              <h1 class="empty-title">Open a presentation</h1>
              <p class="empty-text">Choose a PowerPoint file, or drop one here. It is read in this browser and never uploaded.</p>
              <button class="op-btn primary" id="open-button" type="button">Open a file…</button>
            </div>
          </div>
          <div class="drop-veil" id="drop-veil" hidden><span>Drop to open</span></div>
        </section>
        <!-- The notes pane, under the slide as in PowerPoint. -->
        <section class="notes-pane" id="notes-pane" aria-label="Notes">
          <p class="notes-text" id="notes-text">Speaker notes are not shown yet.</p>
        </section>
      </div>
    </main>

    <footer class="bottom-bar" role="status">
      <span class="slide-indicator" id="slide-indicator"></span>
      <span class="tb-status" id="tb-status">Loading the engine…</span>
      <button class="report-btn" id="report-btn" type="button" hidden></button>
      <span class="bottom-status"><span class="dot"></span>Local only<span class="bottom-status-more"> · nothing uploaded</span></span>
      <span class="bar-spacer"></span>
      <button class="bar-btn" id="notes-toggle" type="button" aria-pressed="true" title="Notes">Notes</button>
      <div class="view-switch" role="group" aria-label="Views" id="view-switch"></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button class="bar-btn" id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
        <button class="bar-btn zoom-level" id="zoom-level" type="button" title="Zoom">Fit</button>
        <button class="bar-btn" id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="bar-btn" id="zoom-fit" type="button" title="Fit slide to current window" aria-label="Fit slide to current window"></button>
      </div>
    </footer>

    <input type="file" id="file-input" class="sr-only" tabindex="-1" aria-hidden="true"
      accept=".pptx,.pptm,.ppsx,.ppsm,.potx,.potm,application/vnd.openxmlformats-officedocument.presentationml.presentation" />

    <div class="op-modal" id="op-modal" hidden>
      <div class="op-modal-box" role="dialog" aria-modal="true" aria-labelledby="op-modal-title">
        <button class="op-modal-x" id="op-modal-x" type="button" aria-label="Close"></button>
        <h2 class="op-modal-title" id="op-modal-title"></h2>
        <div class="op-modal-body" id="op-modal-body"></div>
      </div>
    </div>

    <!-- The slide show: one slide, full screen, as PowerPoint's Slide Show view. -->
    <div class="show" id="show" hidden tabindex="0" aria-label="Slide show">
      <img class="show-img" id="show-img" alt="" draggable="false" />
      <img class="show-fade" id="show-fade" alt="" draggable="false" hidden />
    </div>

    <script type="module" src="./editor.js"></script>
  </body>
</html>
